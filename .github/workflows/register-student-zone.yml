---
name: Register Student Zone

"on":
  workflow_dispatch:
    inputs:
      subdomain_name:
        description: Subdomain to delegate under cubix.ecklm.com
        required: true
        type: string
      name_server_1:
        description: First delegated zone name server
        required: true
        type: string
      name_server_2:
        description: Second delegated zone name server
        required: false
        type: string
      name_server_3:
        description: Third delegated zone name server
        required: false
        type: string
      name_server_4:
        description: Fourth delegated zone name server
        required: false
        type: string
      port_context:
        description: Port action run context
        required: false
        default: '{"runId":""}'
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Student Zone PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Update student zones
        env:
          SUBDOMAIN_NAME: ${{ inputs.subdomain_name }}
          NAME_SERVER_1: ${{ inputs.name_server_1 }}
          NAME_SERVER_2: ${{ inputs.name_server_2 }}
          NAME_SERVER_3: ${{ inputs.name_server_3 }}
          NAME_SERVER_4: ${{ inputs.name_server_4 }}
        run: |
          set -euo pipefail

          subdomain="${SUBDOMAIN_NAME,,}"
          subdomain="${subdomain//[[:space:]]/}"
          zone_path="students/${subdomain}.json"

          if [[ ! "${subdomain}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "subdomain_name must be a single DNS label using lowercase letters, numbers, or hyphens" >&2
            exit 1
          fi

          name_servers=()
          for value in "${NAME_SERVER_1}" "${NAME_SERVER_2}" "${NAME_SERVER_3}" "${NAME_SERVER_4}"; do
            value="${value,,}"
            value="${value//[[:space:]]/}"

            if [[ -z "${value}" || "${value}" == "null" ]]; then
              continue
            fi

            if [[ "${value}" != *. ]]; then
              value="${value}."
            fi

            name_servers+=("${value}")
          done

          if [[ "${#name_servers[@]}" -eq 0 ]]; then
            echo "at least one name server is required" >&2
            exit 1
          fi

          if [[ -e "${zone_path}" ]]; then
            echo "student zone already exists: ${subdomain}" >&2
            exit 1
          fi

          name_servers_json=$(jq -n '$ARGS.positional' --args "${name_servers[@]}")

          mkdir -p students
          jq -n \
            --arg subdomain "${subdomain}" \
            --argjson name_servers "${name_servers_json}" \
            '{($subdomain): {subdomain_name: $subdomain, name_servers: $name_servers}}' \
            > "${zone_path}"

          jq -e \
            --arg subdomain "${subdomain}" \
            'keys == [$subdomain]
              and .[$subdomain].subdomain_name == $subdomain
              and (.[$subdomain].name_servers | type == "array" and length > 0)' \
            "${zone_path}" >/dev/null

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Generate Port PR Token
        id: port-pr-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PORT_PR_APP_ID }}
          private-key: ${{ secrets.PORT_PR_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.port-pr-token.outputs.token }}
          branch: port/register-${{ inputs.subdomain_name }}
          delete-branch: true
          commit-message: "user: Add ${{ inputs.subdomain_name }}"
          title: "user: Add ${{ inputs.subdomain_name }}"
          body: |
            Port.io requested delegation for `${{ inputs.subdomain_name }}.cubix.ecklm.com`.

            This PR adds `students/${{ inputs.subdomain_name }}.json` with the supplied name servers.

      - name: Enable Auto-Merge PR
        env:
          GH_TOKEN: ${{ steps.port-pr-token.outputs.token }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --merge

          echo "Waiting for PR to be merged..."
          while [[ "$(gh pr view "$PR_URL" --json state --jq .state)" != "MERGED" ]]; do
            if [[ "$(gh pr view "$PR_URL" --json state --jq .state)" == "CLOSED" ]]; then
              echo "PR was closed without merging."
              exit 1
            fi
            sleep 10
          done
          echo "PR successfully merged."

      - name: Report Final Status to Port
        if: ${{ always() && fromJson(inputs.port_context).runId != '' }}
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          status: ${{ job.status == 'success' && 'SUCCESS' || 'FAILURE' }}
          logMessage: "GitHub workflow completed with status: ${{ job.status }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
