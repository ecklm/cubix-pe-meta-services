---
name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: 8820d9af-b533-4848-9bf3-ebf24d29d140
  ARM_SUBSCRIPTION_ID: d4d35aad-20e7-4b76-bbb0-944c0f092cc4
  PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
  PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

jobs:
  pull-request-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      # Terraform's -lock-timeout retries normal lock contention, but AzureRM can
      # fail immediately when the blob lease exists and terraformlockid metadata
      # is empty. Poll the backend blob lease directly before plan/apply so the
      # command starts only after Azure reports the state blob as unlocked.
      - &wait-terraform-state-lock
        name: Wait for Terraform State Lock
        run: |
          set -euo pipefail

          timeout_seconds=600
          sleep_seconds=15
          elapsed_seconds=0

          while true; do
            lease_status="$(az storage blob show \
              --account-name cubixmetastore \
              --container-name tfstate \
              --name metaservices.tfstate \
              --auth-mode login \
              --query properties.lease.status \
              --output tsv)"

            if [[ "${lease_status}" == "unlocked" ]]; then
              echo "Terraform state blob is unlocked."
              break
            fi

            if (( elapsed_seconds >= timeout_seconds )); then
              echo "Timed out waiting for Terraform state blob lease to be released." >&2
              exit 1
            fi

            echo "Terraform state blob is ${lease_status}; waiting ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
            elapsed_seconds=$((elapsed_seconds + sleep_seconds))
          done

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=10m

  manual-plan:
    name: Terraform Plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - *wait-terraform-state-lock

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=10m

  apply:
    name: Terraform Apply
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - *wait-terraform-state-lock

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=10m
