---
name: Delete Student Zone

on:
  workflow_dispatch:
    inputs:
      subdomain_name:
        description: Subdomain to delete under cubix.ecklm.com
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Student Zone PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Delete student zone entry
        env:
          SUBDOMAIN_NAME: ${{ inputs.subdomain_name }}
        run: |
          set -euo pipefail
          tfvars_path="students.auto.tfvars.json"
          subdomain="${SUBDOMAIN_NAME,,}"
          subdomain="${subdomain//[[:space:]]/}"

          if ! jq -e --arg subdomain "${subdomain}" '.student_zones | has($subdomain)' "${tfvars_path}" >/dev/null; then
            echo "student zone does not exist: ${subdomain}" >&2
            exit 1
          fi

          jq --arg subdomain "${subdomain}" 'del(.student_zones[$subdomain])' "${tfvars_path}" > "${tfvars_path}.tmp"
          mv "${tfvars_path}.tmp" "${tfvars_path}"

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: port/delete-${{ inputs.subdomain_name }}
          delete-branch: true
          commit-message: "user: Delete ${{ inputs.subdomain_name }}"
          title: "user: Delete ${{ inputs.subdomain_name }}"
          body: |
            Port.io requested deletion for `${{ inputs.subdomain_name }}.cubix.ecklm.com`.
            
            This PR updates `students.auto.tfvars.json` to remove the delegated zone.

      - name: Approve and Auto-Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --merge

          echo "Waiting for PR to be merged..."
          while [[ "$(gh pr view "$PR_URL" --json merged --jq .merged)" != "true" ]]; do
            if [[ "$(gh pr view "$PR_URL" --json state --jq .state)" == "CLOSED" ]]; then
              echo "PR was closed without merging."
              exit 1
            fi
            sleep 10
          done
          echo "PR successfully merged."
